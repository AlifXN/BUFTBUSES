<!DOCTYPE html>
<html>
<head>
    <title>Bus Live Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .top-bar {
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            border: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .controls {
            text-align: center;
            margin: 10px;
        }

        .controls button {
            background: #16a34a;
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>🚌 Bus Live Dashboard</h1>

<div class="top-bar">
    <input type="text" id="search" placeholder="Search bus..." onkeyup="filterBuses()">
</div>

<div class="controls">
    <button onclick="openAll()">🚀 Open All</button>
    <button onclick="loadBuses()">🔄 Reset</button>
</div>

];

const container = document.getElementById("busContainer");

function loadBuses(list = buses) {
    container.innerHTML = "";
    list.forEach(bus => {
        const btn = document.createElement("button");
        btn.innerText = bus.name;
        btn.onclick = () => window.open(bus.url, "_blank");
        container.appendChild(btn);
    });
}

function filterBuses() {
    const value = document.getElementById("search").value.toLowerCase();
    const filtered = buses.filter(b => b.name.toLowerCase().includes(value));
    loadBuses(filtered);
}

function openAll() {
    buses.forEach(bus => window.open(bus.url, "_blank"));
}

loadBuses();

</script>

</body>
</html>
