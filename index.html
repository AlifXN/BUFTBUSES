<!DOCTYPE html>
<html>
<head>
    <title>Bus Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        input {
            padding: 10px;
            width: 80%;
            max-width: 400px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .top-btn {
            margin: 10px;
            padding: 12px 20px;
            background: #16a34a;
        }
    </style>
</head>

<body>

<h1>🚌 Bus Tracker</h1>

<input type="text" id="search" placeholder="Search Bus..." onkeyup="filterBus()">

<br>

<button class="top-btn" onclick="openAll()">🚀 Open All</button>

<p>Auto refresh every 30 seconds</p>

<div class="grid" id="busContainer"></div>

];

const container = document.getElementById("busContainer");

function loadBuses() {
    container.innerHTML = "";
    buses.forEach(bus => {
        const btn = document.createElement("button");
        btn.innerText = bus.name;
        btn.onclick = () => window.open(bus.link, "_blank");
        container.appendChild(btn);
    });
}

function filterBus() {
    const search = document.getElementById("search").value.toLowerCase();
    container.innerHTML = "";
    buses
        .filter(bus => bus.name.toLowerCase().includes(search))
        .forEach(bus => {
            const btn = document.createElement("button");
            btn.innerText = bus.name;
            btn.onclick = () => window.open(bus.link, "_blank");
            container.appendChild(btn);
        });
}

function openAll() {
    buses.forEach(bus => window.open(bus.link, "_blank"));
}

// Auto refresh every 30 sec
setInterval(() => {
    location.reload();
}, 30000);

loadBuses();
