<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUFT Smart Shuttle Tracker</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

<style>
/* (UNCHANGED CSS — SAME AS YOUR ORIGINAL) */
</style>
</head>

<body>

<div id="floating-night-notice" class="floating-notice">
🌙 Service Temporarily Paused — Resumes at 7:00 AM
</div>

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div id="map"></div>

<!-- DASHBOARD -->
<div class="dashboard">
    <div class="header-row">
        <div class="live-badge"></div>
        <h2>BUFT Smart Shuttle Tracker</h2>
    </div>

    <div id="status-text">Syncing live vehicle data...</div>

    <button onclick="findUser()" class="loc-btn">
        <span>📍</span> Find My Location
    </button>
</div>

<script>
"use strict";

const SERVER = "https://bus-server-lr2x.onrender.com";

const map = L.map('map', {
    zoomControl: false,
    attributionControl: false
}).setView([23.8741, 90.3992], 12);

L.control.zoom({position: 'bottomright'}).addTo(map);

L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0','mt1','mt2','mt3']
}).addTo(map);

/* STATE */
let globalFleetData = [];
let mapMarkersObj = {};
let userMarker = null;
let isSidebarBuilt = false;

/* SIDEBAR UI */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function toggleAbout() {
    const box = document.getElementById('about-box');
    box.style.display = (box.style.display === "block") ? "none" : "block";
}

/* STATUS UI UPDATE */
function updateStatus(text, color="#059669") {
    const el = document.getElementById('status-text');
    el.innerText = text;
    el.style.color = color;
}

/* FETCH FLEET */
async function fetchFleet() {
    try {
        const res = await fetch(`${SERVER}/fleet`);
        const fleet = await res.json();

        let activeCount = 0;

        fleet.forEach(bus => {
            if (bus.status !== "Inactive") activeCount++;

            if (bus.lat && bus.lng) {
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="font-weight:700;">🚌</div>`
                });

                if (mapMarkersObj[bus.id]) {
                    mapMarkersObj[bus.id].setLatLng([bus.lat, bus.lng]);
                } else {
                    mapMarkersObj[bus.id] = L.marker([bus.lat, bus.lng], {icon}).addTo(map);
                }
            }
        });

        updateStatus(`🟢 Live Buses: ${activeCount}`);

    } catch (err) {
        updateStatus("⚠️ Unable to sync live data", "#ef4444");
    }
}

/* NIGHT MODE */
function isNightTime() {
    const d = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Dhaka"}));
    const h = d.getHours();
    const m = d.getMinutes();
    return (h > 21 || (h === 21 && m >= 30) || h < 7);
}

function checkTimeAndFetch() {
    if (isNightTime()) {
        document.getElementById('floating-night-notice').style.display = 'block';
        updateStatus("🌙 Service Offline (Night Mode)", "#f59e0b");
    } else {
        document.getElementById('floating-night-notice').style.display = 'none';
        fetchFleet();
    }
}

/* INIT */
checkTimeAndFetch();
setInterval(checkTimeAndFetch, 5000);

</script>

</body>
</html>
