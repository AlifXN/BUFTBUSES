<!DOCTYPE html>
<html>
<head>
    <title>Transport Control Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #111827;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        input {
            width: 90%;
            max-width: 400px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-bottom: 15px;
        }

        .buttons {
            margin: 10px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .open-all {
            background: #22c55e;
        }

        .reset {
            background: #3b82f6;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .bus-btn {
            background: #1f2937;
            color: white;
            border: 1px solid #374151;
        }

        .bus-btn:hover {
            background: #374151;
        }
    </style>
</head>

<body>

<header>
    <h1>🚌 Transport Control Panel</h1>
    <p>Live Bus Access Dashboard</p>
</header>

<div class="container">

    <input type="text" id="search" placeholder="Search bus number..." onkeyup="filterBuses()">

    <div class="buttons">
        <button class="open-all" onclick="openAll()">🚀 Open All Buses</button>
        <button class="reset" onclick="loadBuses()">🔄 Reset</button>
    </div>

    <div class="grid" id="busContainer"></div>

</div>

<script>

const buses = [
"Bus 356302|https://app.bongoiot.com/jsp/quickview.jsp?param=MzU2MzAyJkJ1cyZFTiZzZXJ2ZXJQdXNoRmxhZz10cnVl",
"Bus 356300|https://app.bongoiot.com/jsp/quickview.jsp?param=MzU2MzAwJkJ1cyZFTiZzZXJ2ZXJQdXNoRmxhZz10cnVl",
"Bus 356309|https://app.bongoiot.com/jsp/quickview.jsp?param=MzU2MzA5JkJ1cyZFTiZzZXJ2ZXJQdXNoRmxhZz10cnVl",
"Bus 356329|https://app.bongoiot.com/jsp/quickview.jsp?param=MzU2MzI5JlNjaG9vbEJ1cyZFTiZzZXJ2ZXJQdXNoRmxhZz10cnVl",
"Bus 356330|https://app.bongoiot.com/jsp/quickview.jsp?param=MzU2MzMwJkJ1cyZFTiZzZXJ2ZXJQdXNoRmxhZz10cnVl"
];

const container = document.getElementById("busContainer");

function loadBuses(list = buses) {
    container.innerHTML = "";

    list.forEach(item => {
        const [name, link] = item.split("|");

        const btn = document.createElement("button");
        btn.className = "bus-btn";
        btn.innerText = name;

        btn.onclick = () => {
            window.open(link, "_blank");
        };

        container.appendChild(btn);
    });
}

function filterBuses() {
    const val = document.getElementById("search").value.toLowerCase();

    const filtered = buses.filter(b =>
        b.toLowerCase().includes(val)
    );

    loadBuses(filtered);
}

function openAll() {
    buses.forEach(item => {
        const link = item.split("|")[1];
        window.open(link, "_blank");
    });
}

loadBuses();

</script>

</body>
</html>
