<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R1EWC93EWM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R1EWC93EWM');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUFT Real-Time Transit Tracker</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Outfit', sans-serif; background: #f0f2f5; overflow: hidden; }

        #map { height: 100vh; width: 100%; z-index: 1; }

        .dashboard {
            position: absolute; top: 15px; right: 15px;
            background: #ffffff; padding: 12px 18px;
            border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 1000; display: flex; flex-direction: column; align-items: center;
        }

        h2 { margin: 0; font-size: 16px; font-weight: 800; }

        .menu-btn {
            position: absolute; top: 15px; left: 15px;
            background: white; border: none; padding: 12px 15px;
            border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            font-size: 20px; cursor: pointer;
        }

        .sidebar {
            position: fixed; top: 0; left: -340px;
            width: 320px; height: 100%;
            background: white; transition: left 0.3s;
            padding: 20px; z-index: 9999;
        }

        .sidebar.open { left: 0; }

        .sidebar-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .loc-btn {
            margin-top: 8px;
            width: 100%;
            padding: 8px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        #status-text {
            font-size: 12px;
            font-weight: 700;
            background: #f1f5f9;
            padding: 5px 12px;
            border-radius: 12px;
            text-align: center;
        }

        .bus-list-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8fafc;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .bus-name { font-weight: 600; font-size: 14px; }

        body.dark-mode { background: #0f172a; }
    </style>
</head>

<body>

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">
        <h2>🚍 Fleet Overview</h2>
    </div>

    <input type="text" id="search-box" placeholder="Search fleet..." onkeyup="filterSidebar()">

    <div id="bus-list-container">
        <div style="text-align:center;padding:20px;">📡 Connecting to system...</div>
    </div>

</div>

<div id="map"></div>

<div class="dashboard">
    <h2>BUFT Real-Time Transit Tracker</h2>
    <div id="status-text">Connecting to Online Fleet...</div>
    <button onclick="findUser()" class="loc-btn">📍 Live Position</button>
</div>

<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
}

function filterSidebar(){
    let q = document.getElementById("search-box").value.toLowerCase();
    let rows = document.querySelectorAll(".bus-list-item");
    rows.forEach(r=>{
        r.style.display = r.innerText.toLowerCase().includes(q) ? "flex":"none";
    });
}

function findUser(){
    alert("Live Position Tracking Activated");
}
</script>

</body>
</html>
