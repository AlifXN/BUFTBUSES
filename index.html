<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BUFT Bus Tracker Pro+</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:rgba(255,255,255,0.75);
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --success:#22c55e;
  --danger:#ef4444;
  --shadow:0 12px 35px rgba(0,0,0,0.10);
  --radius:18px;
}

body.dark{
  --bg:#0b1220;
  --card:rgba(17,24,39,0.75);
  --text:#e5e7eb;
  --muted:#94a3b8;
  --shadow:0 12px 35px rgba(0,0,0,0.45);
}

*{box-sizing:border-box;font-family:Outfit,sans-serif;}
body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;transition:.3s;}
#map{height:100vh;width:100%;}

/* Topbar */
.topbar{
  position:absolute;top:15px;left:15px;right:15px;
  display:flex;justify-content:space-between;align-items:center;
  z-index:1000;
}

.card{
  background:var(--card);
  backdrop-filter:blur(14px);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:12px 16px;
  border:1px solid rgba(255,255,255,0.2);
}

.title{font-weight:800;font-size:16px;}
.status{font-size:12px;color:var(--muted);margin-top:2px;}

.btn{
  border:none;cursor:pointer;
  padding:10px 14px;
  border-radius:14px;
  font-weight:700;
  transition:.2s;
}
.btn:hover{transform:scale(1.05);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-ghost{background:var(--card);color:var(--text);}

/* Sidebar */
.sidebar{
  position:fixed;left:-360px;top:0;
  width:340px;height:100%;
  background:var(--card);
  backdrop-filter:blur(16px);
  transition:.35s;
  padding:16px;
  z-index:2000;
  border-right:1px solid rgba(255,255,255,0.2);
}
.sidebar.open{left:0;}

.search{
  width:100%;padding:12px;
  border-radius:12px;border:1px solid #e2e8f0;
  margin:10px 0;
  outline:none;
}

.bus-item{
  padding:12px;
  border-radius:14px;
  background:rgba(241,245,249,0.8);
  margin-bottom:8px;
  display:flex;justify-content:space-between;
  cursor:pointer;
  transition:.2s;
}
.bus-item:hover{transform:translateX(4px);}
body.dark .bus-item{background:rgba(31,41,55,0.7);}

.dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1;}
.dot.active{background:var(--success);box-shadow:0 0 10px var(--success);}

/* Floating Action */
.fab{
  position:absolute;right:18px;bottom:28px;
  z-index:1000;
  display:flex;flex-direction:column;gap:10px;
}

.fab button{
  width:52px;height:52px;border-radius:50%;
  border:none;box-shadow:var(--shadow);
  background:var(--card);
  cursor:pointer;
  font-size:18px;
}

/* Popup */
.leaflet-popup-content-wrapper{
  border-radius:16px;
  backdrop-filter:blur(10px);
}

</style>
</head>

<body>

<div id="map"></div>

<!-- Topbar -->
<div class="topbar">
  <div class="card">
    <div class="title">🚍 BUFT Bus Tracker Pro+</div>
    <div class="status" id="status">Connecting to server...</div>
  </div>

  <div style="display:flex;gap:10px;">
    <button class="btn btn-ghost" onclick="toggleTheme()">🌙</button>
    <button class="btn btn-primary" onclick="toggleSidebar()">☰</button>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <h3>🚌 Live Buses</h3>
  <input class="search" placeholder="Search bus..." onkeyup="filterBus(this.value)" />
  <div id="busList"></div>
</div>

<!-- FAB -->
<div class="fab">
  <button onclick="locateUser()">📍</button>
</div>

<script>
const map = L.map('map').setView([23.874,90.399],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const SERVER="https://bus-server-lr2x.onrender.com";
let markers={}, buses=[];

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
function toggleTheme(){document.body.classList.toggle('dark');}

function filterBus(q){
  document.querySelectorAll('.bus-item').forEach(e=>{
    e.style.display=e.innerText.toLowerCase().includes(q.toLowerCase())?'flex':'none';
  });
}

async function load(){
  try{
    const res=await fetch(SERVER+'/fleet');
    buses=await res.json();

    document.getElementById('status').innerText=`Active Buses: ${buses.length}`;

    const list=document.getElementById('busList');
    list.innerHTML='';

    buses.forEach(b=>{
      const div=document.createElement('div');
      div.className='bus-item';
      div.innerHTML=`<span>${b.name}</span><span class="dot ${b.status==='Running'?'active':''}"></span>`;
      div.onclick=()=>map.setView([b.lat,b.lng],16);
      list.appendChild(div);

      if(!markers[b.id]){
        markers[b.id]=L.marker([b.lat,b.lng]).addTo(map);
      }else{
        markers[b.id].setLatLng([b.lat,b.lng]);
      }
    });

  }catch(e){
    document.getElementById('status').innerText="Server offline";
  }
}

function locateUser(){
  navigator.geolocation.getCurrentPosition(p=>{
    map.setView([p.coords.latitude,p.coords.longitude],16);
  });
}

load();
setInterval(load,4000);
</script>

</body>
</html>
