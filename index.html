<script>
// 1. Initialize the Map
// Coordinates set to center around the campus area
const map = L.map('map', { zoomControl: false }).setView([23.8864, 90.3936], 14);

// 2. Add Map Tiles (Using OpenStreetMap - completely free and doesn't require API keys)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors | ALIF XN'
}).addTo(map);

// Move zoom controls to the bottom right so they don't block the UI
L.control.zoom({ position: 'bottomright' }).addTo(map);

// 3. Mock Fleet Data (Simulating a live backend connection)
const fleetData = [
    { id: 1, name: "Route 1 - Express", status: "En Route", lat: 23.8864, lng: 90.3936 },
    { id: 2, name: "Route 2 - Local", status: "Boarding", lat: 23.8800, lng: 90.3950 },
    { id: 3, name: "Route 3 - Shuttle", status: "Delayed", lat: 23.8900, lng: 90.3900 }
];

// 4. Render Data to Map and Sidebar
function loadFleetData() {
    const container = document.getElementById('bus-list-container');
    container.innerHTML = ''; // Clears the "Connecting..." message

    fleetData.forEach(bus => {
        // Set dynamic colors based on status
        let statusColor = '#eab308'; // Yellow default
        if (bus.status === 'En Route') statusColor = '#22c55e'; // Green
        if (bus.status === 'Delayed') statusColor = '#ef4444'; // Red

        // Build Sidebar Item
        const busHTML = `
            <div class="bus-list-item" onclick="focusBus(${bus.lat}, ${bus.lng})">
                <span class="bus-name">${bus.name}</span>
                <span style="font-size: 12px; color: ${statusColor}; font-weight: bold;">${bus.status}</span>
            </div>
        `;
        container.innerHTML += busHTML;

        // Add Marker to Map
        L.marker([bus.lat, bus.lng]).addTo(map)
            .bindPopup(`<b>${bus.name}</b><br>Status: ${bus.status}`);
    });

    // Update the Dashboard Status Badge
    const statusBadge = document.getElementById('status-text');
    statusBadge.className = 'status-badge active';
    statusBadge.innerHTML = '<span class="status-dot"></span> System Online';
}

// Simulate network loading time (1.5 seconds) then load the mock data
setTimeout(loadFleetData, 1500);

// --- UI Functions ---

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
}

function filterSidebar(){
    let q = document.getElementById("search-box").value.toLowerCase();
    let rows = document.querySelectorAll(".bus-list-item");
    rows.forEach(r => {
        let text = r.querySelector('.bus-name').innerText.toLowerCase();
        r.style.display = text.includes(q) ? "flex" : "none";
    });
}

// Click a bus in the sidebar to fly to it on the map
function focusBus(lat, lng) {
    map.flyTo([lat, lng], 16, { duration: 1.5 });
    // Auto-close sidebar on mobile after clicking
    if(window.innerWidth < 768) toggleSidebar(); 
}

// Live GPS Tracking
function findUser(){
    const locBtn = document.querySelector('.loc-btn');
    locBtn.innerHTML = "Fetching GPS...";
    
    // Request device location
    map.locate({setView: true, maxZoom: 16});
    
    // If successful
    map.on('locationfound', function(e) {
        L.marker(e.latlng).addTo(map).bindPopup("Your Live Position").openPopup();
        locBtn.innerHTML = "📍 Location Found";
        setTimeout(() => locBtn.innerHTML = "📍 Live Position", 3000); // Reset text
    });
    
    // If user denies permission or it fails
    map.on('locationerror', function(e) {
        alert("Could not access location. Please check your browser's GPS permissions.");
        locBtn.innerHTML = "📍 Live Position";
    });
}
</script>
