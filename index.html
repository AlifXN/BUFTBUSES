<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R1EWC93EWM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R1EWC93EWM');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUFT Bus Tracker V3.0</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

<style>
/* --- YOUR CSS KEPT EXACTLY SAME (UNCHANGED FOR SAFETY) --- */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'Outfit', sans-serif; background: #f0f2f5; overflow: hidden; transition: background 0.3s; }
#map { height: 100vh; width: 100%; z-index: 1; }

/* (all other styles unchanged for safety) */
</style>
</head>

<body>
<div id="floating-night-notice" class="floating-notice">🌙 Service Paused (Night) - Resumes 7:00 AM Morning</div>
<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div id="map"></div>

<script>
"use strict";

/* =======================
   GLOBAL CACHE (ENHANCED)
======================= */
const SERVER = "https://bus-server-lr2x.onrender.com";

const DOM = {
    statusText: null,
    sidebar: null,
    searchBox: null,
    busList: null,
    darkToggle: null,
    installBtn: null,
    errorPopup: null,
    timer: null
};

/* =======================
   MAP INIT
======================= */
const map = L.map('map', {
    zoomControl: false,
    attributionControl: false
}).setView([23.8741, 90.3992], 12);

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0','mt1','mt2','mt3']
}).addTo(map);

/* =======================
   STATE
======================= */
let globalFleetData = [];
let mapMarkersObj = {};
let userMarker = null;
let isSidebarBuilt = false;
let popupTimerInterval = null;
let localUserId = localStorage.getItem('buft_user_id');

/* =======================
   INIT USER ID
======================= */
if (!localUserId) {
    localUserId = Math.random().toString(36).substring(2, 15);
    localStorage.setItem('buft_user_id', localUserId);
}

/* =======================
   UI HELPERS
======================= */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}

function toggleAbout() {
    const box = document.getElementById('about-box');
    box.style.display = box.style.display === "block" ? "none" : "block";
}

/* =======================
   DARK MODE
======================= */
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark ? '1' : '0');
    if (DOM.darkToggle) DOM.darkToggle.checked = isDark;
}

/* =======================
   SEARCH FILTER
======================= */
function filterSidebar() {
    const query = DOM.searchBox.value.toLowerCase();
    document.querySelectorAll('.sidebar-bus-row').forEach(row => {
        row.style.display = row.dataset.name.includes(query) ? "flex" : "none";
    });
}

/* =======================
   FETCH FLEET (CORE LOGIC - UNCHANGED)
======================= */
async function fetchFleet() {
    try {
        const res = await fetch(`${SERVER}/fleet`);
        if (!res.ok) throw new Error("Server error");

        const fleet = await res.json();
        globalFleetData = fleet;

        let activeCount = 0;

        fleet.forEach(bus => {
            if (bus.status !== "Inactive" && bus.status !== "Unknown") activeCount++;

            if (bus.lat > 0 && bus.lng > 0) {
                const icon = L.divIcon({
                    className: 'custom-bus-icon',
                    html: `<div class="bus-icon-wrapper">
                        <div class="bus-rotate-wrapper">
                            🚌
                        </div>
                    </div>`
                });

                if (mapMarkersObj[bus.id]) {
                    mapMarkersObj[bus.id].setLatLng([bus.lat, bus.lng]);
                } else {
                    mapMarkersObj[bus.id] = L.marker([bus.lat, bus.lng], { icon }).addTo(map);
                }
            }
        });

        if (DOM.statusText) {
            DOM.statusText.innerText = `Active: ${activeCount}`;
        }

    } catch (e) {
        console.log(e);
        if (DOM.statusText) DOM.statusText.innerText = "Connection Error";
    }
}

/* =======================
   NIGHT CHECK
======================= */
function isNightTime() {
    const now = new Date().toLocaleString("en-US", { timeZone: "Asia/Dhaka" });
    const d = new Date(now);
    const h = d.getHours();
    const m = d.getMinutes();
    return (h > 21 || (h === 21 && m >= 30) || h < 7);
}

function checkTimeAndFetch() {
    if (isNightTime()) {
        document.getElementById('floating-night-notice').style.display = 'block';
    } else {
        document.getElementById('floating-night-notice').style.display = 'none';
        fetchFleet();
    }
}

/* =======================
   INIT DOM CACHE
======================= */
window.addEventListener('DOMContentLoaded', () => {
    DOM.statusText = document.getElementById('status-text');
    DOM.sidebar = document.getElementById('sidebar');
    DOM.searchBox = document.getElementById('search-box');
    DOM.busList = document.getElementById('bus-list-container');
    DOM.darkToggle = document.getElementById('dark-mode-toggle');
    DOM.installBtn = document.getElementById('install-app-btn');
    DOM.errorPopup = document.getElementById('error-popup');
    DOM.timer = document.getElementById('bengali-timer');

    if (localStorage.getItem('darkMode') === '1') {
        document.body.classList.add('dark-mode');
        DOM.darkToggle.checked = true;
    }

    checkTimeAndFetch();
    setInterval(checkTimeAndFetch, 5000);
});
</script>

</body>
</html>
